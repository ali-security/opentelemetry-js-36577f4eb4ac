name: Unit Tests
on:
  workflow_dispatch:

jobs:
  node-tests:
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - "14"
          - "16"
          - "18"
          - "20"
          - "22"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: ${{ matrix.node_version }}

      # npm@12.0.0 drops support for Node.js v20
      - run: npm install -g npm@"<12.0.0"
        if: ${{ matrix.node_version == '20' || matrix.node_version == '22' }}

      # npm@10.0.0 drops support for Node.js v14 and v16
      - run: npm install -g npm@"<10.0.0"
        if: ${{ matrix.node_version == '14' || matrix.node_version == '16' }}

      # npm@11.0.0 drops support for Node.js v18
      - run: npm install -g npm@"<11.0.0"
        if: ${{ matrix.node_version == '18'}}

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        env:
          # Node.js >=22.18 enables TypeScript type-stripping by default, which
          # intercepts .ts before ts-node/register and cannot parse
          # `import x = require(...)`. The flag does not exist on Node <=20.
          NODE_OPTIONS: ${{ matrix.node_version == '22' && '--no-experimental-strip-types' || '' }}
        run: npm run test

      - name: Pack @opentelemetry/core
        if: ${{ matrix.node_version == '22' }}
        run: |
          mkdir -p ./seal-pack
          npm pack --workspace=packages/opentelemetry-core --pack-destination=./seal-pack
          mv ./seal-pack/opentelemetry-core-*.tgz ./seal-pack/core-1.30.1.tgz
          ls -l ./seal-pack

      - name: Upload @opentelemetry/core tarball
        if: ${{ matrix.node_version == '22' }}
        uses: actions/upload-artifact@v4
        with:
          name: opentelemetry-core-npm-tarball
          path: ./seal-pack/core-1.30.1.tgz
          if-no-files-found: error
  node-windows-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: '20'

      # npm@12.0.0 drops support for Node.js v20. The `<12.0.0` range form used
      # on the Linux legs is not usable here: `<` is a reserved operator in the
      # PowerShell shell GitHub uses on windows runners.
      - run: npm install -g npm@11

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: |
          npm config set script-shell "C:\\Program Files\\git\\bin\\bash.exe"
          npm run compile

      - name: Unit tests
        run: npm run test
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: 22

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        run: npm run test:browser
  webworker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: 22

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        run: npm run test:webworker
  api-eol-node-test:
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - "8"
          - "10"
          - "12"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: ${{ matrix.node_version }}

      - name: Build
        working-directory: ./api
        run: |
          # This job installs with `npm install` (no lockfile), so it resolves
          # TODAY's transitive deps: sinon pulls @sinonjs/samsam 8.0.3, which
          # uses optional chaining and cannot be parsed by Node 8/10/12.
          # Pinning the registry to the release date resolves the dependency
          # versions that existed then (samsam 8.0.2, ES5-parseable).
          npm config set registry 'https://:2025-01-14T09%3A16%3A11.405Z@time-machines-npm.sealsecurity.io/'
          npm install --ignore-scripts
          # ts-node is required by the repo-root .mocharc.yml (`require:
          # ts-node/register`), which mocha find-up's from ./api. It is only
          # hoisted into the ROOT node_modules, which this job never installs,
          # so `require('ts-node/register')` fails, mocha's CLI hits its
          # internal fail() and then crashes inside old yargs' showHelp while
          # printing the error -- collecting ZERO tests while still exiting 0
          # on Node 8/10/12. ts-node@8 is the last line supporting Node >=6.
          # nise>=5.1.6 depends on @sinonjs/fake-timers@^11, which uses
          # optional chaining and cannot be PARSED by Node 8/10/12. nise 5.1.5
          # takes fake-timers@^10 (ES5-parseable) and satisfies sinon 15.1.2's
          # own `nise@^5.1.4` range, so the repo's pinned sinon is unchanged.
          npm install @types/mocha@^7 mocha@^7 ts-loader@^8 ts-node@^8.10.2 nise@5.1.5
          node ../scripts/version-update.js
          npx tsc --build tsconfig.json tsconfig.esm.json

      - name: Test
        working-directory: ./api
        # running test:eol as node 8 is not supported anymore by the version of nyc we use, as we don't report coverage
        # for this step we leave it out.
        # Details: nyc requires istanbul-lib-report, which silently dropped support for Node.js v8 when going from
        # 3.0.0 to 3.0.1 by requiring make-dir@^4.0.0 to fix https://github.com/advisories/GHSA-c2qf-rxjj-qqgw.
        # make-dir does not support Node.js v8 anymore.
        run: npm run test:eol
